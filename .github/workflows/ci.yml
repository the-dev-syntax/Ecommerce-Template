name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/ev_ci
      AUTH_SECRET: ci-only-auth-secret-change-me-1234567890
      AUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      SENDER_EMAIL: ci@example.com
      SENDER_NAME: CI Store
      RESEND_API_KEY: re_ci_placeholder
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run seed

      - run: npx tsc --noEmit

      - run: npm run lint

      - run: npm run i18n:check

      - run: npm test

      - run: npm run build
